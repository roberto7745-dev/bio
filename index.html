<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@roberto7745</title>

    <!-- Icono de la pestaña del navegador (se actualiza solo con tu foto de Discord) -->
    <link id="favicon" rel="icon" type="image/png" href="https://cdn.discordapp.com/embed/avatars/0.png">

    <!-- Embed para Discord -->
    <meta property="og:title" content="Roberto (@roberto7745)">
    <meta property="og:description" content="Bienvenido a mi bio oficial.">
    <meta property="og:url" content="https://roberto7745.es">
    <meta name="theme-color" content="#ff2a4b">

    <!-- Fuente Pixel e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pixelify Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla "Click Anywhere" */
        #enter-screen {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #enter-screen h2 {
            font-family: 'Silkscreen', monospace;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Fondo de constelaciones */
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* Contenedor 3D más grande */
        .bio-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform-style: preserve-3d;
        }

        /* Cajas oscuras con borde rojizo */
        .box {
            background: rgba(12, 12, 14, 0.84);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(175, 38, 55, 0.32);
            border-radius: 8px;
            padding: 22px 26px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
            transition: border-color 0.3s ease;
        }

        .box:hover {
            border-color: rgba(235, 55, 75, 0.6);
        }

        /* Caja 1: Perfil principal */
        .profile-box {
            position: relative;
            text-align: center;
            padding: 34px 26px 28px;
        }

        .views {
            position: absolute;
            top: 18px;
            left: 20px;
            font-size: 1.05rem;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'Silkscreen', monospace;
        }

        .main-avatar {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .username {
            font-family: 'Silkscreen', monospace;
            font-size: 1.95rem;
            margin-bottom: 6px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
        }

        .subtitle {
            font-size: 1.15rem;
            color: #b0b3b8;
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 1.65rem;
            transition: transform 0.2s, color 0.2s, text-shadow 0.2s;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .social-icons a:hover {
            transform: scale(1.18);
            color: #ff3b5c;
        }

        /* Caja 2: Portfolio Próximamente */
        .link-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            padding: 18px 24px;
            cursor: default;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-left i {
            font-size: 1.65rem;
            color: #e5e7eb;
        }

        .link-text h3 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .link-text p {
            font-size: 0.95rem;
            color: #9ca3af;
        }

        .soon-badge {
            font-family: 'Silkscreen', monospace;
            font-size: 0.75rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.45);
            color: #fca5a5;
            padding: 5px 10px;
            border-radius: 5px;
            letter-spacing: 1px;
        }

        /* Caja 3: Estado de Discord en vivo */
        .discord-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
        }

        .discord-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .discord-avatar-wrap {
            position: relative;
            width: 64px;
            height: 64px;
        }

        .discord-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #0c0c0e;
            background-color: #23a55a;
        }

        .discord-info h4 {
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .discord-info p {
            font-size: 0.98rem;
            color: #b0b3b8;
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .add-discord-btn {
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 9px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .add-discord-btn:hover {
            background: rgba(255, 59, 92, 0.25);
            border-color: #ff3b5c;
        }

        /* Caja 4: Reproductor de música + Volumen */
        .music-box {
            padding: 18px 24px;
        }

        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .song-title {
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vol-icon {
            cursor: pointer;
            color: #d1d5db;
            font-size: 0.95rem;
            width: 18px;
            text-align: center;
            transition: color 0.2s;
        }

        .vol-icon:hover {
            color: #ef4444;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 75px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            background: #ef4444;
            border-radius: 50%;
            cursor: pointer;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Silkscreen', monospace;
            font-size: 0.8rem;
            color: #d1d5db;
        }

        .progress-container {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #b91c1c;
            border-radius: 4px;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -3.5px;
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
        }

        .play-btn {
            cursor: pointer;
            color: #ef4444;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA CLICK ANYWHERE -->
    <div id="enter-screen">
        <h2>Click Anywhere</h2>
    </div>

    <!-- 2. FONDO DE PARTÍCULAS -->
    <div id="particles-js"></div>

    <!-- 3. CONTENEDOR CON EFECTO 3D AL MOVER EL RATÓN -->
    <div class="bio-wrapper" data-tilt data-tilt-max="8" data-tilt-speed="400" data-tilt-perspective="1100">
        
        <!-- Tarjeta Principal -->
        <div class="box profile-box">
            <div class="views">
                <i class="fa-regular fa-eye"></i>
                <span id="view-count">...</span>
            </div>

            <img id="main-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" class="main-avatar">
            <h1 class="username">Roberto</h1>
            <p class="subtitle">SysAdmin, Gaming & Hardware</p>

            <div class="social-icons">
                <a href="https://discord.com/users/701457608850276382" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
                <a href="https://medal.tv/u/roberto7745?invite=ur-MSxBbVUsMjQ3NzI0MTY2" target="_blank" title="Medal.tv"><i class="fa-solid fa-medal"></i></a>
                <a href="https://github.com/roberto7745-dev" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
            </div>
        </div>

        <!-- Portfolio Próximamente -->
        <div class="box link-box">
            <div class="link-left">
                <i class="fa-solid fa-code"></i>
                <div class="link-text">
                    <h3>Portfolio Oficial</h3>
                    <p>Proyectos, servidores y setup</p>
                </div>
            </div>
            <span class="soon-badge">PRÓXIMAMENTE</span>
        </div>

        <!-- Caja de Estado de Discord en Vivo -->
        <div class="box discord-box">
            <div class="discord-left">
                <div class="discord-avatar-wrap">
                    <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord" class="discord-avatar">
                    <span id="status-dot" class="status-dot"></span>
                </div>
                <div class="discord-info">
                    <h4 id="discord-user">@roberto7745</h4>
                    <p id="discord-status">Online</p>
                </div>
            </div>
            <a id="discord-link" href="https://discord.com/users/701457608850276382" target="_blank" class="add-discord-btn">
                Add on Discord
            </a>
        </div>

        <!-- Reproductor de Música -->
        <div class="box music-box">
            <div class="music-header">
                <div class="song-title">
                    <i class="fa-solid fa-music" style="color: #ef4444;"></i>
                    <span id="song-name">Ni borracho - Quevedo</span>
                </div>
                <div class="volume-controls">
                    <i class="fa-solid fa-volume-low vol-icon" id="vol-icon"></i>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.45">
                </div>
            </div>
            <div class="player-controls">
                <span id="current-time">00:12</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span id="duration">00:00</span>
                <i class="fa-solid fa-pause play-btn" id="play-btn"></i>
            </div>
            <audio id="bg-music" src="musica.mp3" preload="auto" loop></audio>
        </div>

    </div>

    <!-- Librerías: Particles.js y Vanilla-Tilt.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <script>
        const DISCORD_ID = "701457608850276382";
        const START_SECOND = 12;

        const enterScreen = document.getElementById('enter-screen');
        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volIcon = document.getElementById('vol-icon');
        let fadeInterval = null;

        // 1. Entrada en el segundo 12 con volumen progresivo (Fade-In)
        enterScreen.addEventListener('click', () => {
            enterScreen.classList.add('hidden');
            
            const targetVolume = parseFloat(volumeSlider.value);
            audio.volume = 0;

            const startPlayback = () => {
                audio.currentTime = START_SECOND;
                audio.play().then(() => {
                    let currentVol = 0;
                    fadeInterval = setInterval(() => {
                        currentVol += 0.015;
                        if (currentVol >= targetVolume) {
                            audio.volume = targetVolume;
                            clearInterval(fadeInterval);
                        } else {
                            audio.volume = currentVol;
                        }
                    }, 90); // Sube progresivamente durante ~3 segundos
                }).catch(() => {});
            };

            if (audio.readyState >= 1) {
                startPlayback();
            } else {
                audio.addEventListener('loadedmetadata', startPlayback, { once: true });
                audio.load();
            }
        });

        // 2. Control de Volumen y Mute
        function updateVolumeIcon(vol) {
            if (vol === 0 || audio.muted) {
                volIcon.className = 'fa-solid fa-volume-xmark vol-icon';
            } else if (vol < 0.5) {
                volIcon.className = 'fa-solid fa-volume-low vol-icon';
            } else {
                volIcon.className = 'fa-solid fa-volume-high vol-icon';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            if (fadeInterval) clearInterval(fadeInterval);
            const val = parseFloat(e.target.value);
            audio.muted = false;
            audio.volume = val;
            updateVolumeIcon(val);
        });

        volIcon.addEventListener('click', () => {
            if (fadeInterval) clearInterval(fadeInterval);
            audio.muted = !audio.muted;
            updateVolumeIcon(audio.muted ? 0 : audio.volume);
        });

        // 3. Controles de la barra de progreso
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${pct || 0}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            audio.currentTime = (e.offsetX / width) * audio.duration;
        });

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.className = 'fa-solid fa-pause play-btn';
            } else {
                audio.pause();
                playBtn.className = 'fa-solid fa-play play-btn';
            }
        });

        // 4. Contador de visitas real
        fetch('https://abacus.jasoncameron.dev/hit/roberto7745.es/views')
            .then(res => res.json())
            .then(data => {
                document.getElementById('view-count').textContent = data.value;
            })
            .catch(() => {
                document.getElementById('view-count').textContent = "15";
            });

        // 5. Foto (Perfil + Pestaña del navegador) y Estado de Discord
        function setAvatarImages(url) {
            document.getElementById('discord-avatar').src = url;
            document.getElementById('main-avatar').src = url;
            document.getElementById('favicon').href = url;
        }

        async function loadFallbackAvatar() {
            try {
                const res = await fetch(`https://discordlookup.mesalytic.moe/v1/user/${DISCORD_ID}`);
                const user = await res.json();
                if (user && user.avatar && user.avatar.link) {
                    setAvatarImages(`${user.avatar.link}?size=256`);
                }
                if (user && user.username) {
                    document.getElementById('discord-user').textContent = `@${user.username}`;
                }
            } catch (e) {
                console.error("Fallback avatar error:", e);
            }
        }

        async function fetchDiscordStatus() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const json = await res.json();

                if (!json.success || !json.data) {
                    await loadFallbackAvatar();
                    return;
                }

                const data = json.data;
                const avatarHash = data.discord_user.avatar;
                if (avatarHash) {
                    const ext = avatarHash.startsWith('a_') ? 'gif' : 'png';
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${avatarHash}.${ext}?size=256`;
                    setAvatarImages(avatarUrl);
                }

                document.getElementById('discord-user').textContent = `@${data.discord_user.username}`;

                const statusColors = {
                    online: '#23a55a',
                    idle: '#f0b232',
                    dnd: '#f23f43',
                    offline: '#80848e'
                };
                document.getElementById('status-dot').style.backgroundColor = statusColors[data.discord_status] || '#80848e';

                const customStatus = data.activities.find(a => a.type === 4);
                const playingGame = data.activities.find(a => a.type === 0);

                if (customStatus && customStatus.state) {
                    document.getElementById('discord-status').textContent = customStatus.state;
                } else if (playingGame) {
                    document.getElementById('discord-status').textContent = `Jugando a ${playingGame.name}`;
                } else {
                    const statusLabels = {
                        online: 'En línea',
                        idle: 'Ausente',
                        dnd: 'No molestar',
                        offline: 'Desconectado'
                    };
                    document.getElementById('discord-status').textContent = statusLabels[data.discord_status] || 'En línea';
                }
            } catch (err) {
                await loadFallbackAvatar();
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 15000);

        // 6. Configuración del fondo de constelaciones (Particles.js)
        particlesJS("particles-js", {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                opacity: { value: 0.35 },
                size: { value: 2, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#ffffff",
                    opacity: 0.22,
                    width: 1
                },
                move: { enable: true, speed: 1.2 }
            },
            interactivity: {
                events: {
                    onhover: { enable: true, mode: "grab" }
                }
            }
        });
    </script>
</body>
</html>
